<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgS2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#EFE9D8"/>
    </linearGradient>
    <pattern id="hatchS2" width="14" height="14" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
