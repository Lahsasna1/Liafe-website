<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgS3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#EFE9D8"/>
    </linearGradient>
    <pattern id="hatchS3" width="14" height="14" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#0B1F3A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#bgS3)"/>
  <rect width="400" height="300" fill="url(#hatchS3)"/>
  <circle cx="200" cy="150" r="92" fill="none" stroke="#C9A227" stroke-opacity="0.25" stroke-width="1"/>

  <!-- document with bar chart -->
  <g transform="translate(178,150)">
    <rect x="-44" y="-52" width="88" height="104" rx="6" fill="none" stroke="#0B1F3A" stroke-width="2.4"/>
    <line x1="-28" y1="-30" x2="28" y2="-30" stroke="#0B1F3A" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <rect x="-26" y="8" width="10" height="20" fill="#0B1F3A" fill-opacity="0.55"/>
    <rect x="-9" y="-2" width="10" height="30" fill="#0B1F3A" fill-opacity="0.75"/>
    <rect x="8" y="-14" width="10" height="42" fill="#C9A227"/>
  </g>
  <!-- magnifying glass -->
  <g transform="translate(238,182)" stroke="#0B1F3A" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="24"/>
    <line x1="17" y1="17" x2="38" y2="38"/>
  </g>
</svg>
