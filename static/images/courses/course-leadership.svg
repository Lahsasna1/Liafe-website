<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="bgC4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#EFE9D8"/>
    </linearGradient>
    <pattern id="hatchC4" width="14" height="14" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#0B1F3A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="350" fill="url(#bgC4)"/>
  <rect width="800" height="350" fill="url(#hatchC4)"/>
  <circle cx="400" cy="175" r="130" fill="none" stroke="#C9A227" stroke-opacity="0.22" stroke-width="1"/>

  <!-- podium blocks -->
  <g>
    <rect x="352" y="192" width="34" height="48" fill="#0B1F3A" fill-opacity="0.55"/>
    <rect x="390" y="164" width="34" height="76" fill="#0B1F3A"/>
    <rect x="428" y="206" width="34" height="34" fill="#0B1F3A" fill-opacity="0.4"/>
  </g>
  <!-- rising figures as simple dots+lines -->
  <g stroke="#C9A227" stroke-width="2.6" stroke-linecap="round">
    <circle cx="407" cy="130" r="8" fill="#C9A227" stroke="none"/>
    <line x1="407" y1="140" x2="407" y2="160"/>
  </g>
  <!-- upward growth arrow -->
  <g stroke="#0B1F3A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="330,150 360,120 380,138 420,98"/>
    <polyline points="404,98 420,98 420,114"/>
  </g>
</svg>
