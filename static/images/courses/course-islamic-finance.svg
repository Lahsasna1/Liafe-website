<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <linearGradient id="bgC1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#EFE9D8"/>
    </linearGradient>
    <pattern id="hatchC1" width="14" height="14" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#0B1F3A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="350" fill="url(#bgC1)"/>
  <rect width="800" height="350" fill="url(#hatchC1)"/>
  <circle cx="400" cy="175" r="130" fill="none" stroke="#C9A227" stroke-opacity="0.22" stroke-width="1"/>

  <!-- coin stacks -->
  <g transform="translate(340,205)">
    <ellipse cx="0" cy="18" rx="30" ry="9" fill="none" stroke="#0B1F3A" stroke-width="2.6"/>
    <ellipse cx="0" cy="4" rx="30" ry="9" fill="none" stroke="#0B1F3A" stroke-width="2.6"/>
    <ellipse cx="0" cy="-10" rx="30" ry="9" fill="none" stroke="#0B1F3A" stroke-width="2.6"/>
    <ellipse cx="0" cy="-24" rx="30" ry="9" fill="#0B1F3A"/>
    <circle cx="0" cy="-24" r="4" fill="#C9A227"/>
  </g>
  <g transform="translate(430,222)">
    <ellipse cx="0" cy="12" rx="22" ry="6.5" fill="none" stroke="#C9A227" stroke-width="2.4"/>
    <ellipse cx="0" cy="0" rx="22" ry="6.5" fill="none" stroke="#C9A227" stroke-width="2.4"/>
    <ellipse cx="0" cy="-12" rx="22" ry="6.5" fill="#C9A227"/>
  </g>

  <!-- geometric 8-point star accent -->
  <g transform="translate(400,100)" stroke="#0B1F3A" stroke-opacity="0.35" stroke-width="1.6" fill="none">
    <rect x="-16" y="-16" width="32" height="32" transform="rotate(0)"/>
    <rect x="-16" y="-16" width="32" height="32" transform="rotate(45)"/>
  </g>
</svg>
