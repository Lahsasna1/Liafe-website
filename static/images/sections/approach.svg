<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2647"/>
      <stop offset="1" stop-color="#0A1B33"/>
    </linearGradient>
    <pattern id="hatchB" width="14" height="14" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#bgB)"/>
  <rect width="400" height="300" fill="url(#hatchB)"/>

  <g stroke="#E8C969" stroke-opacity="0.22" stroke-width="1">
    <circle cx="200" cy="150" r="86" fill="none"/>
    <circle cx="200" cy="150" r="108" fill="none" stroke-opacity="0.12"/>
  </g>

  <!-- three converging pillars: faith / finance / evidence -->
  <g transform="translate(200,150)">
    <line x1="0" y1="46" x2="-70" y2="46" stroke="#E8C969" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="0" y1="46" x2="70" y2="46" stroke="#E8C969" stroke-opacity="0.5" stroke-width="1.4"/>

    <!-- pillar 1: faith - arch -->
    <g transform="translate(-56,10)">
      <path d="M-14,36 L-14,4 A14,14 0 0 1 14,4 L14,36" fill="none" stroke="#E8C969" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="-14" y1="36" x2="14" y2="36" stroke="#E8C969" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- pillar 2: evidence - scale, center, largest -->
    <g transform="translate(0,-8)">
      <line x1="0" y1="-40" x2="0" y2="30" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="-32" y1="-24" x2="32" y2="-24" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M-32,-24 L-44,2 A12,10 0 0 0 -20,2 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      <path d="M32,-24 L44,2 A12,10 0 0 1 20,2 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      <line x1="-14" y1="30" x2="14" y2="30" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    </g>

    <!-- pillar 3: finance - coin stack -->
    <g transform="translate(56,16)">
      <ellipse cx="0" cy="20" rx="16" ry="5" fill="none" stroke="#E8C969" stroke-width="2.2"/>
      <ellipse cx="0" cy="12" rx="16" ry="5" fill="none" stroke="#E8C969" stroke-width="2.2"/>
      <ellipse cx="0" cy="4" rx="16" ry="5" fill="none" stroke="#E8C969" stroke-width="2.2"/>
    </g>
  </g>

  <text x="200" y="266" text-anchor="middle" font-family="Georgia, 'Fraunces', serif" font-size="13" letter-spacing="3" fill="#E8C969" fill-opacity="0.65">FAITH · FINANCE · EVIDENCE</text>
</svg>
