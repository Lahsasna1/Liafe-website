<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgR3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#EFE9D8"/>
    </linearGradient>
    <pattern id="hatchR3" width="14" height="14" patternTransform="rotate(135)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#0B1F3A" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#bgR3)"/>
  <rect width="400" height="300" fill="url(#hatchR3)"/>
  <circle cx="200" cy="150" r="92" fill="none" stroke="#C9A227" stroke-opacity="0.25" stroke-width="1"/>

  <!-- globe -->
  <g transform="translate(200,150)" stroke="#0B1F3A" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="52"/>
    <ellipse cx="0" cy="0" rx="52" ry="20"/>
    <ellipse cx="0" cy="0" rx="22" ry="52"/>
    <line x1="-52" y1="0" x2="52" y2="0" stroke-opacity="0.5"/>
  </g>
  <!-- orbiting community nodes -->
  <g fill="#C9A227">
    <circle cx="200" cy="70" r="6"/>
    <circle cx="278" cy="150" r="6"/>
    <circle cx="122" cy="150" r="6"/>
    <circle cx="200" cy="230" r="6"/>
  </g>
  <g stroke="#C9A227" stroke-width="1.4" stroke-opacity="0.55">
    <line x1="200" y1="76" x2="200" y2="98"/>
    <line x1="272" y1="150" x2="252" y2="150"/>
    <line x1="128" y1="150" x2="148" y2="150"/>
    <line x1="200" y1="224" x2="200" y2="202"/>
  </g>
</svg>
